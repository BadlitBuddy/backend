name: CD - Deploy to Dev

on:
  workflow_run:
    workflows: ["CI - Build and Push Docker Images"]
    types: [completed]
    branches: ["dev"]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave empty to use commit SHA)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Services (Cloud Run & Compute Engine)
    environment: development
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Determine Image Tag
        id: image-tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            TAG="sha-${SHORT_SHA}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="sha-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare API Environment Variables
        env:
          API_ENV_BASE64: ${{ secrets.API_ENV_BASE64 }}
        run: |
          echo "$API_ENV_BASE64" | base64 -d > api.env

      - name: Deploy API Service to Cloud Run
        run: |
          echo "Deploying bb-api image tag: ${{ steps.image-tag.outputs.tag }}"
          gcloud run deploy bb-api \
            --image=docker.io/${{ secrets.DOCKER_USERNAME }}/bb-api:${{ steps.image-tag.outputs.tag }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ secrets.GCP_REGION }} \
            --env-vars-file=api.env \
            --allow-unauthenticated \
            --cpu-throttling \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=50 \
            --startup-probe=httpGet.path=/health,initialDelaySeconds=30,periodSeconds=10,failureThreshold=3 \
            --liveness-probe=httpGet.path=/alive,periodSeconds=20

      - name: Clean up API Environment Variables
        if: always()
        run: rm -f api.env

      - name: Deploy Whisper Service to Compute Engine
        env:
          WHISPER_ENV_BASE64: ${{ secrets.WHISPER_ENV_BASE64 }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          echo "$WHISPER_ENV_BASE64" | base64 -d > whisper.env
          echo -e "\nIMAGE_TAG=${IMAGE_TAG}" >> whisper.env

          gcloud compute ssh ${{ secrets.VM_NAME }} \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --quiet \
            --command="mkdir -p ~/whisper-service"

          gcloud compute scp WhisperService.WorkerService/docker-compose.dev.yml \
            ${{ secrets.VM_NAME }}:~/whisper-service/docker-compose.yml \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --quiet

          gcloud compute scp whisper.env \
            ${{ secrets.VM_NAME }}:~/whisper-service/.env \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --quiet

          gcloud compute ssh ${{ secrets.VM_NAME }} \
            --zone=${{ secrets.VM_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --quiet \
            --command="
              set -e
              cd ~/whisper-service
              docker compose pull
              docker compose up -d --remove-orphans
              docker image prune -f
            "

      - name: Clean up Whisper Environment Variables
        if: always()
        run: rm -f whisper.env
